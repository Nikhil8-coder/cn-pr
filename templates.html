<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Client-Server Chat</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  #chat-box { width: 100%; height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px;}
  #status { margin-bottom: 10px; font-weight: bold; }
  #concepts { margin-top: 20px; background: #f8f8f8; padding: 10px; border: 1px solid #bbb; }
  input[type="text"] { width: 80%; padding: 10px; }
  button { padding: 10px; }
</style>
</head>
<body>

<h2>Client-Server Chat Application</h2>
<div id="status">Status: <span id="connection-status">Disconnected</span></div>

<div id="chat-box"></div>

<input type="text" id="message" placeholder="Type message..." autocomplete="off" />
<button onclick="sendMessage()">Send</button>

<div id="concepts">
  <h3>Networking Concepts</h3>
  <ul>
    <li><b>IP Address:</b> <span id="ip-address">localhost</span></li>
    <li><b>Port:</b> <span id="port-number">5000</span></li>
    <li><b>Protocol:</b> TCP via WebSocket</li>
    <li><b>Connection Status:</b> <span id="conn-status-concept">Disconnected</span></li>
  </ul>
</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script src="/static/script.js"></script>

</body>
</html>
